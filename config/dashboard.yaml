# ============================================================
# dashboard.yaml — 教学看板插件配置
# 工程基线: app_mgr_object-0.2.1
# 关联文档: doc/72 教学看板插件开发方案
# ============================================================

teaching_dashboard:
  # 启用开关
  enabled: true

  # 数据库文件路径（与 reports / diagnosis_results 同库）
  db_path: "config/app.db"

  # 看板数据刷新间隔（秒）
  refresh_interval_sec: 30

  # 高频错误点展示数量
  top_error_limit: 5

  # 错误综合得分权重（遗漏率 / 超时率 / 顺序错误率）
  error_weights:
    omission: 0.4
    timeout: 0.4
    sequence_chaos: 0.2

  # 通过线（total_score >= pass_threshold 视为通过）
  pass_threshold: 60.0

  # 学员成绩波动阈值（最近 N 次报告 total_score 标准差 > 此值视为波动大）
  volatility_threshold: 15.0

  # 需关注学员列表上限
  attention_limit: 20
