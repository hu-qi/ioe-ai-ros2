# 起始仓位数据融合插件配置
auto_start: true
stable_threshold: 3
filter_timeout: 2.0
bind_enabled: true
ai_topic: "/dev01_object_status"
# 主题活跃集修剪窗口（秒）：topic 全量周期发布(0.3s/帧)，超过该窗口未出现的仓位
# 视为已消失（改名/删除），自动从缓存与滤波器清理，防止前端残留旧仓位（doc/仓位名称类型编排 §13）
prune_timeout: 2.0

# 仓位编排（doc/仓位名称类型编排）：名称/类型权威 = rtsp 节点参数（polygon_chX_names / bay_cargo_types），
# 实际货物类型以 AI 检测话题为准；此处仅作前端显示定义对比（AI 类型 ≠ 定义类型时界面标识），不影响业务
