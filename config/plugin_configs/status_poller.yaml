# 状态轮询插件配置
auto_start: true
enabled: true
robot_ids: [1001, 1002]
robot_poll_interval: 3.0
dest_poll_interval: 10.0

# RCS→内部状态映射（doc/52 §7.5）：可热加载
agv_status_mapping:
  IDLE: AVAILABLE
  AVAILABLE: AVAILABLE
  BUSY: BUSY
  OFFLINE: OFFLINE
  ERROR: ERROR

# 目的仓位编排（doc/仓位名称类型编排）：名称/数量以本配置为权威（app_mgr yaml），
# 可通过界面「目的仓编排」修改 → 保存热加载（dest_cache + trigger 实时生效）
dest_bay_configs:
  T2001: {cargo_type: 1, floor: 2}
  T2002: {cargo_type: 1, floor: 2}
  T2003: {cargo_type: 2, floor: 2}
  T2004: {cargo_type: 2, floor: 2}
  T2005: {cargo_type: 3, floor: 2}
  T2006: {cargo_type: 3, floor: 2}
  T3001: {cargo_type: 4, floor: 3}
  T3002: {cargo_type: 4, floor: 3}
  T3003: {cargo_type: 5, floor: 3}
  T3004: {cargo_type: 5, floor: 3}
  T3005: {cargo_type: 6, floor: 3}
  T3006: {cargo_type: 6, floor: 3}
  T4001: {cargo_type: 1, floor: 4}
  T4002: {cargo_type: 2, floor: 4}
  T4003: {cargo_type: 3, floor: 4}
  T4004: {cargo_type: 4, floor: 4}
  T4005: {cargo_type: 5, floor: 4}
  T4006: {cargo_type: 6, floor: 4}

# ── 配对策略（doc/目的仓位巷道FIFO策略）：巷道/放置策略，前端「目的仓位编排→配对策略」可编辑热加载 ──
# fifo=从入口侧逐个放（前方有货深处不可达）；filo=从深处放；any=任意空位（未配置时兼容行为）
pairing_policy:
  # 巷道状态实时管理开关（doc/触发机制审查 §3.6）：true=按巷道最大占用匹对（最大占用 n → 配 n+1）；
  # false=旧行为（任意空位）。部署确认巷道布局后开启。
  lane_state_management: false
  default_strategy: fifo
  lanes:
    - id: 2F-L1
      floor: 2
      strategy: fifo
      bays: [T2001, T2002]
    - id: 2F-L2
      floor: 2
      strategy: fifo
      bays: [T2003, T2004]
    - id: 2F-L3
      floor: 2
      strategy: fifo
      bays: [T2005, T2006]
    - id: 3F-L1
      floor: 3
      strategy: fifo
      bays: [T3001, T3002]
    - id: 3F-L2
      floor: 3
      strategy: fifo
      bays: [T3003, T3004]
    - id: 3F-L3
      floor: 3
      strategy: fifo
      bays: [T3005, T3006]
    - id: 4F-L1
      floor: 4
      strategy: fifo
      bays: [T4001, T4002, T4003, T4004, T4005, T4006]
  type_rules:
    1: { lanes: [2F-L1, 4F-L1], strategy: fifo }
    2: { lanes: [2F-L2, 4F-L1], strategy: fifo }
    3: { lanes: [2F-L3, 4F-L1], strategy: fifo }
    4: { lanes: [3F-L1, 4F-L1], strategy: fifo }
    5: { lanes: [3F-L2, 4F-L1], strategy: fifo }
    6: { lanes: [3F-L3, 4F-L1], strategy: fifo }
  bay_rules: {}
