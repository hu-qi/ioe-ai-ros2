{% extends "base.html" %}

{% block title %}告警管理 - 天眼运维监控系统{% endblock %}

{% block content %}
<div class="row">
    <!-- 告警统计 -->
    <div class="col-lg-4">
        <div class="card status-card">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0"><i class="fas fa-chart-bar"></i> 告警统计</h5>
            </div>
            <div class="card-body">
                <div class="text-center">
                    <h1 id="total-alarms">0</h1>
                    <p class="text-muted">总告警数</p>
                </div>
                
                <div class="row text-center mt-3">
                    <div class="col-4">
                        <div class="p-2">
                            <h3 id="critical-alarms" class="text-danger">0</h3>
                            <small>严重告警</small>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="p-2">
                            <h3 id="warning-alarms" class="text-warning">0</h3>
                            <small>警告告警</small>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="p-2">
                            <h3 id="active-alarms" class="text-success">0</h3>
                            <small>活动告警</small>
                        </div>
                    </div>
                </div>
                
                <div class="mt-4">
                    <button class="btn btn-danger w-100 mb-2" onclick="clearAllAlarms()">
                        <i class="fas fa-trash"></i> 清空所有告警
                    </button>
                    <button class="btn btn-secondary w-100" onclick="exportAlarms()">
                        <i class="fas fa-download"></i> 导出告警日志
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 告警类型分布 -->
        <div class="card status-card mt-3">
            <div class="card-header bg-warning text-white">
                <h5 class="mb-0"><i class="fas fa-chart-pie"></i> 告警类型分布</h5>
            </div>
            <div class="card-body">
                <canvas id="alarmTypeChart" height="200"></canvas>
            </div>
        </div>
    </div>
    
    <!-- 告警列表 -->
    <div class="col-lg-8">
        <div class="card status-card">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0"><i class="fas fa-list"></i> 告警列表</h5>
                <div class="btn-group float-end">
                    <button class="btn btn-sm btn-light" onclick="refreshAlarms()">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                    <div class="btn-group">
                        <button type="button" class="btn btn-sm btn-light dropdown-toggle" data-bs-toggle="dropdown">
                            过滤
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#" onclick="filterAlarms('all')">全部告警</a></li>
                            <li><a class="dropdown-item" href="#" onclick="filterAlarms('unacknowledged')">未确认告警</a></li>
                            <li><a class="dropdown-item" href="#" onclick="filterAlarms('critical')">严重告警</a></li>
                            <li><a class="dropdown-item" href="#" onclick="filterAlarms('warning')">警告告警</a></li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover data-table">
                        <thead>
                            <tr>
                                <th>级别</th>
                                <th>时间</th>
                                <th>类型</th>
                                <th>描述</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="alarms-table">
                            <tr>
                                <td colspan="6" class="text-center">正在加载告警列表...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="d-flex justify-content-between align-items-center mt-3">
                    <small class="text-muted" id="alarm-filter-info">显示全部告警</small>
                    <div>
                        <button class="btn btn-sm btn-outline-secondary" onclick="loadMoreAlarms()">
                            加载更多
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 告警趋势 -->
        <div class="card status-card mt-3">
            <div class="card-header bg-info text-white">
                <h5 class="mb-0"><i class="fas fa-chart-line"></i> 告警趋势（最近24小时）</h5>
            </div>
            <div class="card-body">
                <canvas id="alarmTrendChart" height="100"></canvas>
            </div>
        </div>
    </div>
</div>

<!-- 确认告警模态框 -->
<div class="modal fade" id="acknowledgeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">确认告警</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">告警ID</label>
                    <input type="text" class="form-control" id="alarm-id" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label">告警描述</label>
                    <textarea class="form-control" id="alarm-description" rows="3" readonly></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">确认人</label>
                    <input type="text" class="form-control" id="acknowledge-by" value="admin">
                </div>
                <div class="mb-3">
                    <label class="form-label">备注</label>
                    <textarea class="form-control" id="acknowledge-notes" rows="2" placeholder="输入确认备注..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="doAcknowledgeAlarm()">确认告警</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let alarmTypeChart = null;
    let alarmTrendChart = null;
    let currentAlarms = [];
    let currentFilter = 'all';
    let loadLimit = 20;
    
    // 初始化告警类型图表
    function initAlarmTypeChart(alarmStats) {
        const ctx = document.getElementById('alarmTypeChart').getContext('2d');
        
        if (alarmTypeChart) {
            alarmTypeChart.destroy();
        }
        
        const typeData = alarmStats.by_type || {};
        const types = Object.keys(typeData);
        const counts = Object.values(typeData);
        
        const backgroundColors = [
            'rgba(231, 76, 60, 0.8)',
            'rgba(243, 156, 18, 0.8)',
            'rgba(52, 152, 219, 0.8)',
            'rgba(46, 204, 113, 0.8)',
            'rgba(155, 89, 182, 0.8)'
        ];
        
        alarmTypeChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: types,
                datasets: [{
                    data: counts,
                    backgroundColor: backgroundColors.slice(0, types.length),
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom'
                    }
                }
            }
        });
    }
    
    // 初始化告警趋势图表
    function initAlarmTrendChart(alarmHistory) {
        const ctx = document.getElementById('alarmTrendChart').getContext('2d');
        
        if (alarmTrendChart) {
            alarmTrendChart.destroy();
        }
        
        const hours = alarmHistory.hours || [];
        const counts = alarmHistory.counts || [];
        
        alarmTrendChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: hours.map(h => h.split(' ')[1]), // 只显示时间部分
                datasets: [{
                    label: '告警数量',
                    data: counts,
                    borderColor: '#e74c3c',
                    backgroundColor: 'rgba(231, 76, 60, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        title: {
                            display: true,
                            text: '告警数量'
                        }
                    },
                    x: {
                        title: {
                            display: true,
                            text: '时间'
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: false
                    }
                }
            }
        });
    }
    
    // 加载告警数据
    function loadAlarms(limit = 20) {
        let url = `/api/alarms?limit=${limit}`;
        
        if (currentFilter === 'unacknowledged') {
            url += '&acknowledged=false';
        } else if (currentFilter === 'critical') {
            url += '&level=critical';
        } else if (currentFilter === 'warning') {
            url += '&level=warning';
        }
        
        fetch(url)
            .then(response => response.json())
            .then(data => {
                currentAlarms = data;
                updateAlarmsTable();
                updateAlarmStats();
                updateFilterInfo();
            })
            .catch(error => {
                console.error('加载告警失败:', error);
            });
    }
    
    // 更新告警表格
    function updateAlarmsTable() {
        const tbody = document.getElementById('alarms-table');
        
        if (!currentAlarms || currentAlarms.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center">暂无告警</td></tr>';
            return;
        }
        
        let html = '';
        
        currentAlarms.forEach(alarm => {
            const time = new Date(alarm.timestamp * 1000).toLocaleString('zh-CN');
            const level = alarm.level || 'info';
            const type = alarm.type || 'unknown';
            const message = alarm.message || '无描述';
            const acknowledged = alarm.acknowledged || false;
            const resolved = alarm.resolved || false;
            
            let levelBadge = '';
            let statusText = '';
            
            switch(level) {
                case 'critical':
                    levelBadge = '<span class="badge bg-danger">严重</span>';
                    break;
                case 'warning':
                    levelBadge = '<span class="badge bg-warning">警告</span>';
                    break;
                case 'info':
                    levelBadge = '<span class="badge bg-info">信息</span>';
                    break;
                default:
                    levelBadge = '<span class="badge bg-secondary">未知</span>';
            }
            
            if (resolved) {
                statusText = '<span class="badge bg-success">已解决</span>';
            } else if (acknowledged) {
                statusText = '<span class="badge bg-primary">已确认</span>';
            } else {
                statusText = '<span class="badge bg-warning">未处理</span>';
            }
            
            html += `
                <tr class="${acknowledged ? '' : 'table-warning'}">
                    <td>${levelBadge}</td>
                    <td>${time}</td>
                    <td>${type}</td>
                    <td title="${message}">${message.length > 50 ? message.substring(0, 50) + '...' : message}</td>
                    <td>${statusText}</td>
                    <td>
                        <div class="btn-group btn-group-sm">
            `;
            
            if (!acknowledged) {
                html += `
                    <button class="btn btn-primary" onclick="acknowledgeAlarm('${alarm.id}', '${message}')">
                        确认
                    </button>
                `;
            }
            
            if (!resolved) {
                html += `
                    <button class="btn btn-success" onclick="resolveAlarm('${alarm.id}')">
                        解决
                    </button>
                `;
            }
            
            html += `
                            <button class="btn btn-info" onclick="viewAlarmDetails('${alarm.id}')">
                                详情
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        });
        
        tbody.innerHTML = html;
    }
    
    // 更新告警统计
    function updateAlarmStats() {
        fetch('/api/alarms/stats')
            .then(response => response.json())
            .then(stats => {
                document.getElementById('total-alarms').textContent = stats.total_alarms || 0;
                document.getElementById('critical-alarms').textContent = stats.by_level?.critical || 0;
                document.getElementById('warning-alarms').textContent = stats.by_level?.warning || 0;
                document.getElementById('active-alarms').textContent = stats.unacknowledged_alarms || 0;
                
                // 更新图表
                initAlarmTypeChart(stats);
                
                // 获取告警历史
                fetch('/api/alarms/history?hours=24')
                    .then(response => response.json())
                    .then(history => {
                        initAlarmTrendChart(history);
                    })
                    .catch(error => {
                        console.error('获取告警历史失败:', error);
                    });
            })
            .catch(error => {
                console.error('获取告警统计失败:', error);
            });
    }
    
    // 更新过滤信息
    function updateFilterInfo() {
        let filterText = '';
        switch(currentFilter) {
            case 'all':
                filterText = '显示全部告警';
                break;
            case 'unacknowledged':
                filterText = '显示未确认告警';
                break;
            case 'critical':
                filterText = '显示严重告警';
                break;
            case 'warning':
                filterText = '显示警告告警';
                break;
        }
        
        document.getElementById('alarm-filter-info').textContent = filterText;
    }
    
    // 告警操作函数
    function acknowledgeAlarm(alarmId, description) {
        const modal = new bootstrap.Modal(document.getElementById('acknowledgeModal'));
        
        document.getElementById('alarm-id').value = alarmId;
        document.getElementById('alarm-description').value = description;
        
        modal.show();
    }
    
    function doAcknowledgeAlarm() {
        const alarmId = document.getElementById('alarm-id').value;
        const username = document.getElementById('acknowledge-by').value;
        const notes = document.getElementById('acknowledge-notes').value;
        
        fetch(`/api/alarms/${alarmId}/acknowledge`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                username: username,
                notes: notes
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                showToast('告警已确认', 'success', '✅ 操作成功');
                bootstrap.Modal.getInstance(document.getElementById('acknowledgeModal')).hide();
                loadAlarms(loadLimit);
            } else {
                showResultModal('❌ 操作失败', `确认告警失败：${data.error || '未知错误'}`, 'error');
            }
        })
        .catch(error => {
            showResultModal('❌ 请求失败', `无法连接到服务器：${error.toString()}`, 'error');
        });
    }
    
    function resolveAlarm(alarmId) {
        AppDialog.confirm({ title: '解决告警', message: '确定要标记此告警为已解决吗？', confirmText: '确认解决' })
        .then(ok => {
            if (!ok) return;
            fetch(`/api/alarms/${alarmId}/resolve`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'}
            })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                showToast('告警已标记为已解决', 'success', '✅ 操作成功');
                loadAlarms(loadLimit);
            } else {
                showResultModal('❌ 操作失败', `解决告警失败：${data.error || '未知错误'}`, 'error');
            }
        })
            .catch(error => {
                showResultModal('❌ 请求失败', `无法连接到服务器：${error.toString()}`, 'error');
            });
        });
    }
    
    function viewAlarmDetails(alarmId) {
        // 查找告警详情
        const alarm = currentAlarms.find(a => a.id === alarmId);
        if (!alarm) {
            showResultModal('❌ 错误', '未找到告警详情', 'error');
            return;
        }
        
        const modal = new bootstrap.Modal(document.getElementById('detailModal'));
        const title = document.getElementById('detailModalTitle');
        const content = document.getElementById('detailModalContent');
        
        title.textContent = `告警详情: ${alarmId}`;
        
        let detailText = `告警ID: ${alarm.id}\n`;
        detailText += `级别: ${alarm.level}\n`;
        detailText += `类型: ${alarm.type}\n`;
        detailText += `时间: ${new Date(alarm.timestamp * 1000).toLocaleString('zh-CN')}\n`;
        detailText += `描述: ${alarm.message}\n`;
        detailText += `状态: ${alarm.acknowledged ? '已确认' : '未确认'} | ${alarm.resolved ? '已解决' : '未解决'}\n`;
        
        if (alarm.details) {
            detailText += `\n详细信息:\n${JSON.stringify(alarm.details, null, 2)}`;
        }
        
        content.textContent = detailText;
        modal.show();
    }
    
    function filterAlarms(filterType) {
        currentFilter = filterType;
        loadAlarms(loadLimit);
    }
    
    function refreshAlarms() {
        loadAlarms(loadLimit);
        showToast('告警列表已更新', 'success', '刷新成功');
    }
    
    function loadMoreAlarms() {
        loadLimit += 20;
        loadAlarms(loadLimit);
    }
    
    function clearAllAlarms() {
        AppDialog.confirm({ title: '清空所有告警', message: '确定要清空所有告警吗？此操作不可恢复！', confirmText: '确认清空', danger: true })
        .then(ok => {
            if (!ok) return;
            fetch('/api/alarms', {
                method: 'DELETE'
            })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                showToast('所有告警已清空', 'success', '✅ 操作成功');
                loadAlarms(loadLimit);
            } else {
                showResultModal('❌ 操作失败', `清空告警失败：${data.error || '未知错误'}`, 'error');
            }
        })
            .catch(error => {
                showResultModal('❌ 请求失败', `无法连接到服务器：${error.toString()}`, 'error');
            });
        });
    }
    
    function exportAlarms() {
        // 导出告警功能（统一弹窗）
        AppDialog.alert({ title: '导出告警', message: '导出告警功能待实现，当前告警数量: ' + currentAlarms.length, type: 'info' });
    }
    
    // 页面加载完成
    document.addEventListener('DOMContentLoaded', function() {
        loadAlarms(loadLimit);
        
        // 每30秒自动刷新告警
        setInterval(loadAlarms, 30000);
    });
</script>
{% endblock %}
